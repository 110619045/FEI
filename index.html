<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry | Creative Technologist</title>

    <link rel="stylesheet" href="./css/style_main.css">
    <link rel="stylesheet" href="./css/nav.css">
</head>

<body>

    <div id="cursor-blur"></div>
    <div class="instruction">// Move slowly to reveal intention</div>

    <section class="hero">
        <h1 id="main-title">I design systems and experiences that explore <br> how we perceive and interpret the world<br></h1>
        <div class="subtext" id="subtext">
            To me, the world is not a map to be followed, but a landscape of textures to be sensed
        </div>
    </section>

    <nav>
        <a href="core.html">Core Work</a>
        <a href="practice.html">Practice</a>
        <a href="sandbox.html">Sandbox</a>
        <a href="creative.html">Creative</a>
        <a href="whoami.html">whoami</a>
    </nav>

    <script>
        const blur = document.getElementById('cursor-blur');
        const title = document.getElementById('main-title');
        const subtext = document.getElementById('subtext');

        document.addEventListener('mousemove', (e) => {
            // 移動模糊圓環
            blur.style.left = e.clientX + 'px';
            blur.style.top = e.clientY + 'px';

            // 計算距離中心點的距離
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const distance = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));

            // 如果靠近中心，則文字變清晰 (慢感知的體現)
            if (distance < 200) {
                title.classList.add('reveal');
                subtext.classList.add('reveal');
            } else {
                // 離開後慢慢消失，不讓資訊被「輕易擁有」
                title.classList.remove('reveal');
                subtext.classList.remove('reveal');
            }
        });
    </script>
</body>

</html>
