<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEE SIN FEI</title>

    <link rel="stylesheet" href="./css/style_main.css">
    <link rel="stylesheet" href="./css/nav.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TFRHM8EJRM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-TFRHM8EJRM');
    </script>
</head>

<body>

    <div id="cursor-blur"></div>
    <div class="instruction">// Move slowly to reveal intention</div>

    <section class="hero" style="cursor: pointer;">
        <h1 id="main-title">
            I design systems and experiences that explore <br>
            how we perceive and interpret the world<br>
        </h1>
        <div class="subtext" id="subtext">
            To me, the world is not a map to be followed, but a landscape of textures to be sensed
            <div style="margin: 30px;">
                <span style="font-size: xx-large; color: var(--accent);">ENTER</span>
            </div>
        </div>
    </section>

    <!-- <nav>
        <a href="showcase.html">showcase</a>
        <a href="archive.html">archive</a>
        <a href="playground.html">playground</a>
        <a href="whoami.html">whoami</a>
    </nav> -->

    <div id="mobile-warning">
        <div class="warning-box">
            <p class="warning-text">
                For the best viewing experience, desktop viewing is recommended.
            </p>
            <button onclick="closeWarning()">Continue Anyway</button>
        </div>
    </div>

    <script>
        const blur = document.getElementById('cursor-blur');
        const title = document.getElementById('main-title');
        const subtext = document.getElementById('subtext');

        document.addEventListener('mousemove', (e) => {
            // 移動模糊圓環
            blur.style.left = e.clientX + 'px';
            blur.style.top = e.clientY + 'px';

            // 計算距離中心點的距離
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const distance = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));

            // 如果靠近中心，則文字變清晰 (慢感知的體現)
            if (distance < 200) {
                title.classList.add('reveal');
                subtext.classList.add('reveal');
            } else {
                // 離開後慢慢消失，不讓資訊被「輕易擁有」
                title.classList.remove('reveal');
                subtext.classList.remove('reveal');
            }
        });
    </script>
    <script>
        document.querySelector('.hero').addEventListener('click', () => {
            window.location.href = 'showcase.html';
        });
        function isMobile() {
            return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        function closeWarning() {
            document.getElementById('mobile-warning').style.display = 'none';
        }

        window.addEventListener('load', () => {
            if (!isMobile()) {
                // 如果不是手機 → 不顯示
                document.getElementById('mobile-warning').style.display = 'none';
            }
        });
    </script>
</body>

</html>
