<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <title>Playground | LEE SIN FEI</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Amatic+SC">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="./css/style_main.css">
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/card.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TFRHM8EJRM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-TFRHM8EJRM', {
      page_title: document.title,
      debug_mode: true
    });
  </script>

  <style>
    :root {
      --gap: 22px;
      --line: rgba(255, 255, 255, 0.12);
      --muted: rgba(255, 255, 255, 0.6);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.06);
      --radius: 16px;
      --max: 1400px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .masonry-page {
      width: min(var(--max), calc(100% - 64px));
      margin: 5% auto;
    }

    .masonry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 40px;
    }

    .masonry-title {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .masonry-subtitle {
      margin: 8px 0 0;
      color: #00b3a4;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .masonry-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      padding-top: 8px;
    }

    .masonry {
      column-count: 4;
      column-gap: var(--gap);
    }

    .masonry-card {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: inline-block;
      width: 100%;
      margin: 0 0 var(--gap);
      cursor: zoom-in;
      text-decoration: none;
      color: inherit;
    }

    .masonry-card-inner {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card-bg);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .masonry-card:hover .masonry-card-inner {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .masonry-thumb {
      width: 100%;
      overflow: hidden;
      background: #111;
      border-bottom: 1px solid var(--line);
    }

    .masonry-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .masonry-card.tall .masonry-thumb {
      aspect-ratio: 3 / 4;
    }

    .masonry-card.mid .masonry-thumb {
      aspect-ratio: 4 / 5;
    }

    .masonry-card.short .masonry-thumb {
      aspect-ratio: 4 / 3;
    }

    .masonry-body {
      padding: 14px 14px 16px;
    }

    .masonry-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .masonry-badge {
      display: inline-block;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .masonry-arrow {
      font-size: 14px;
      color: #fff;
    }

    .masonry-name {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .masonry-tools {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .masonry-tool {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .masonry-tool span {
      opacity: 0.7;
      margin-right: 4px;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 9999;
      padding: 24px;
    }

    #lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    #lightbox-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 1100px) {
      .masonry {
        column-count: 3;
      }
    }

    @media (max-width: 760px) {
      .masonry-page {
        width: min(100%, calc(100% - 32px));
        padding-top: 100px;
      }

      .masonry {
        column-count: 2;
      }

      .masonry-header {
        flex-direction: column;
        gap: 8px;
      }

      .masonry-meta {
        white-space: normal;
        padding-top: 0;
      }
    }

    @media (max-width: 480px) {
      .masonry {
        column-count: 1;
      }
    }
  </style>
</head>

<body>

  <div id="cursor-blur"></div>
  <div class="instruction">// Decoding…</div>

  <nav>
    <a href="showcase.html">showcase</a>
    <a href="archive.html">archive</a>
    <a href="playground.html">playground</a>
    <a href="whoami.html">whoami</a>
  </nav>

  <a href="index.html" class="exit-btn">EXIT</a>

  <div id="app" class="w3-black mono-font">

    <div class="masonry-page">

      <header class="masonry-header">
        <div>
          <h1 class="w3-text-white w3-xxlarge"
            style="letter-spacing: 3px; font-weight: bold; margin:0; text-transform: uppercase;">
            SELECTED_playground
          </h1>
          <p class="masonry-subtitle">// {{ cards.length }} Projects Found</p>
        </div>
      </header>

      <section class="masonry">
        <article
          v-for="(card, index) in cards"
          :key="index"
          class="masonry-card"
          :class="card.layout || 'mid'"
          @click="openCard(card)"
        >
          <div class="masonry-card-inner">
            <div class="masonry-thumb">
              <img
                :src="card.img"
                :alt="card.Ename || card.name || 'project'"
                :style="{ objectPosition: card.imgPosition || 'center' }"
              >
            </div>

            <div class="masonry-body">
              <div class="masonry-topline">
                <span class="masonry-badge">{{ card.badge || 'project' }}</span>
              </div>

              <h2 class="masonry-name">{{ card.Ename || card.name || 'Untitled' }}</h2>

              <div class="masonry-tools" v-if="card.tool && card.tool.length">
                <div v-for="(t, i) in card.tool" :key="i" class="masonry-tool">
                  <span>//</span>{{ t.tools }}
                </div>
              </div>
            </div>
          </div>
        </article>
      </section>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" :class="{ active: lightboxOpen }" @click="closeLightbox">
      <img id="lightbox-img" :src="lightboxSrc" alt="Preview">
    </div>
  </div>

  <script>
    const blur = document.getElementById('cursor-blur');

    document.addEventListener('mousemove', (e) => {
      if (blur) {
        blur.style.left = e.clientX + 'px';
        blur.style.top = e.clientY + 'px';
      }
    });
  </script>

  <!-- 你的資料 -->
  <script src="js/playground.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

  <!-- Vue app -->
  <script>
    new Vue({
      el: '#app',

      data: {
        cards: typeof WORKS_DATA !== 'undefined' ? WORKS_DATA : [],
        lightboxOpen: false,
        lightboxSrc: ''
      },

      methods: {
        openCard(card) {
          if (!card || !card.link) return;

          const isImage = /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(card.link);

          if (isImage) {
            this.lightboxSrc = card.link;
            this.lightboxOpen = true;
            document.body.style.overflow = 'hidden';
          } else {
            window.location.href = card.link;
          }
        },

        closeLightbox() {
          this.lightboxOpen = false;
          this.lightboxSrc = '';
          document.body.style.overflow = '';
        },

        handleEsc(e) {
          if (e.key === 'Escape') {
            this.closeLightbox();
          }
        }
      },

      mounted() {
        document.addEventListener('keydown', this.handleEsc);
      },

      beforeDestroy() {
        document.removeEventListener('keydown', this.handleEsc);
      }
    });
  </script>

</body>
</html>
